<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>CCE OPS · Huawei Ascend 指令接口</title>
<style>/*__STYLE__*/</style>
</head>
<body>
<a class="skip-link" href="#main">跳到接口列表</a>
<header class="topbar">
  <a class="brand" href="#" aria-label="CCE OPS 首页">CCE OPS</a>
  <h1 id="page-title">指令接口</h1>
  <div class="toolbar">
    <label class="search"><input id="search" type="search" placeholder="搜索名称、类型、builtin、条件…" aria-label="搜索接口或配套定义" autocomplete="off"><kbd>/</kbd></label>
    <label class="filter" title="本项目按来源头文件划分的接口组，不代表设备支持范围">域<select id="group" aria-label="接口域"><option value="">全部接口域</option></select></label>
    <label class="filter">文件<select id="file" aria-label="源文件"><option value="">全部源文件</option></select></label>
  </div>
  <details class="compatibility-menu"><summary id="compatibility-summary">架构 / 弃用</summary><div class="compatibility-panel">
    <label>CANN 版本<select id="catalog-version" aria-label="CANN 版本" disabled></select></label>
    <label>芯片型号<select id="chip" aria-label="芯片型号"><option value="">未指定芯片</option></select></label>
    <label>核目标参考<output id="core-targets">先选择芯片</output></label>
    <label>架构条件<select id="architecture" aria-label="架构条件"><option value="">全部架构条件</option></select></label>
    <label>条件结果<select id="availability" aria-label="条件结果"><option value="">全部条件结果</option><option value="possible">符合或待确认</option><option value="matches">条件符合</option><option value="excluded">条件排除</option><option value="unknown">待确认</option></select></label>
    <label>弃用标记<select id="deprecation" aria-label="弃用标记"><option value="">全部弃用状态</option><option value="marked">有弃用标记</option><option value="conditional">条件性弃用标记</option><option value="unmarked">未检出标记</option></select></label>
    <p>芯片选择使用平台配置的 NpuArch；核目标仅展示配置，不推断核支持。其他宏保持未知。条件符合不等于可编译。仅有本版本，尚不能判断首次弃用版本。</p>
  </div></details>
  <button id="download" class="quiet-button">导出 JSON</button>
  <div class="top-meta"><span class="version" id="version"></span><a href="https://github.com/mmyy1217/CCE-OPS" target="_blank" rel="noopener">仓库</a></div>
</header>
<nav id="scroll-navigation" class="scroll-navigation" aria-label="结果进度与快速定位" hidden>
  <button id="jump-start" aria-label="跳到结果开头" title="跳到结果开头"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 2h8M3 8l4-4 4 4M7 4v8"/></svg></button>
  <div id="scroll-rail" class="scroll-rail" role="scrollbar" tabindex="0" aria-label="按当前筛选结果定位" aria-orientation="vertical" aria-controls="rows" aria-valuemin="1" aria-valuemax="1" aria-valuenow="1" title="拖动或点击定位；方向键微调，Home / End 到首尾">
    <div id="scroll-thumb" class="scroll-thumb"></div>
    <output id="rail-position" class="rail-position" aria-hidden="true"></output>
  </div>
  <button id="jump-end" aria-label="跳到结果末尾" title="跳到结果末尾"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 12h8M3 6l4 4 4-4M7 2v8"/></svg></button>
</nav>
<div class="workspace">
  <aside id="sidebar" class="sidebar" aria-label="指令分类">
    <nav class="views" aria-label="内容类型">
      <button data-view="interfaces" class="view active">指令接口 <span id="nav-interfaces"></span></button>
      <button data-view="definitions" class="view">配套定义 <span id="nav-definitions"></span></button>
      <button data-view="report" class="view">扫描报告</button>
    </nav>
    <section id="family-section"><h2 title="按接口名称关键词归类，仅用于导航">指令族</h2><div id="families"></div></section>
    <div class="sidebar-note">静态提取<p>编译与运行尚未验证</p></div>
  </aside>
  <div id="resize-sidebar" class="splitter" role="separator" tabindex="0" aria-label="调整左侧栏宽度" aria-orientation="vertical" aria-controls="sidebar" title="拖动或用方向键调整；双击或 Enter 恢复默认宽度"></div>
  <main id="main" tabindex="-1">
    <div class="mobile-nav"><label>浏览<select id="mobile-view"><option value="interfaces">指令接口</option><option value="definitions">配套定义</option><option value="report">扫描报告</option></select></label><label id="mobile-family-label">指令族<select id="mobile-family"></select></label></div>
    <div id="catalog-view">
      <div class="catalog-layout">
        <section class="list-pane" aria-label="检索结果"><div class="list-summary"><div class="progress-summary"><span id="viewport-range" class="viewport-range" title="当前视口中的名称组范围">0–0 / 0</span><span id="progress-scope" class="progress-scope"></span><span id="result-count" role="status" aria-live="polite"></span></div><button id="reset" class="text-button">重置筛选</button></div><div class="table-scroll"><table class="interface-table"><thead><tr><th scope="col">接口 / 名称</th><th scope="col" id="classification-heading" title="按接口名称关键词归类，仅用于导航">指令族</th><th scope="col" title="按来源头文件分组，不代表设备支持范围">域</th><th scope="col" class="number">重载</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden><h2>没有匹配的条目</h2><p>试试更短的名称，或重置筛选。</p><button class="quiet-button" id="empty-reset">重置筛选</button></div></div><div id="load-status" class="load-status" role="status" aria-live="polite"></div></section>
        <div id="resize-detail" class="splitter" role="separator" tabindex="0" aria-label="调整右侧栏宽度" aria-orientation="vertical" aria-controls="detail" title="拖动或用方向键调整；双击或 Enter 恢复默认宽度"></div>
        <section id="detail" class="detail-pane" aria-label="接口详情" tabindex="-1"></section>
      </div>
    </div>
    <section id="report" hidden aria-label="扫描报告"></section>
    <footer><span id="footer-source"></span><span>来源可追溯 · 离线可阅读</span></footer>
  </main>
</div>
<div id="announcement" class="toast" role="status" aria-live="polite"></div>
<noscript>本手册需要启用 JavaScript 才能搜索和浏览接口。结构化数据可在仓库 data 目录读取。</noscript>
<script id="catalog-data" type="application/json">/*__DATA__*/</script>
<script>/*__SCRIPT__*/</script>
</body>
</html>
