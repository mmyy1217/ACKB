<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>ACKB · AI Compiler 目标知识库</title>
<style>/*__STYLE__*/</style>
</head>
<body>
<a class="skip-link" href="#main">跳到接口列表</a>
<header class="topbar">
  <a class="brand" href="#home" aria-label="ACKB 首页">ACKB</a>
  <a class="insights-link" href="#insights">洞察</a>
  <label class="backend-switch"><span class="sr-only">目标后端</span><select id="backend" aria-label="目标后端"><option value="nvvm">NVVM IR</option><option value="llvm">LLVM IR</option><option value="ccec">CCEC 编程接口</option><option value="ccec-intrinsics">CCEC Builtins</option><option value="ascendc">AscendC 基础 C++ API</option><option value="ascendc-capi">AscendC C / SIMT API</option><option value="cce-dialect">CCE Dialect 语义 Ops</option><option value="cce-dialect-intrinsics">CCE Dialect LLVM Intrinsics</option><option value="ptx">PTX 虚拟指令集</option></select></label>
  <h1 id="page-title">指令接口</h1>
  <div class="toolbar"><label id="symbol-depth-control" hidden>展开 <input id="symbol-depth" type="range" min="1" max="1" value="1" aria-label="符号展开层级"><span id="symbol-depth-label">全部展开</span></label>
    <label class="filter" title="本项目按来源头文件划分的接口组，不代表设备支持范围">域<select id="group" aria-label="接口域"><option value="">全部接口域</option></select></label>
    <label class="filter">文件<select id="file" aria-label="源文件"><option value="">全部源文件</option></select></label>
    <span id="fixed-chip" class="filter" title="固定目标：Ascend950PR_9579 · NpuArch 3510">950 / A5</span>
    <label id="unknown-filter" class="filter"><input id="include-unknown" type="checkbox"><span id="unknown-label">显示待确认</span></label>
    <label class="filter ptx-filter" hidden>架构<select id="ptx-target" aria-label="PTX 架构"><option value="sm_103a">B300 · sm_103a</option><option value="sm_103f">B300 · sm_103f</option><option value="sm_103">B300 · sm_103</option></select></label><label class="filter ptx-filter support-filter" hidden>文档条件<select id="ptx-support" aria-label="PTX 文档支持"><option value="">全部状态</option><option value="documented_supported">文档支持</option><option value="partial">部分形式</option><option value="documented_not_supported">文档排除</option><option value="unknown">待确认</option></select></label>
    <label class="filter llvm-filter" hidden>范围<select id="llvm-scope" aria-label="LLVM 范围"><option value="a5-evidence">950 包内证据</option><option value="a5-sources">A5 相关线索</option><option value="all">全部范围</option></select></label><label class="filter llvm-filter" hidden>证据<select id="llvm-evidence" aria-label="LLVM 证据"><option value="">全部</option><option value="registry">编译器注册</option><option value="bitcode_call">c310 直接调用</option><option value="bitcode_declaration">Bitcode 声明</option><option value="binary_string">字符串出现</option></select></label>
    <label class="search"><input id="search" type="search" placeholder="搜索名称、类型、builtin、条件…" aria-label="搜索接口或配套定义" autocomplete="off"><kbd>/</kbd></label>
  </div>
  <div class="top-meta"><span class="version" id="version"></span><a href="https://github.com/mmyy1217/ACKB" target="_blank" rel="noopener">仓库</a></div>
  <button id="coverage" class="quiet-button">说明 / 覆盖</button>
  <button id="download" class="quiet-button">导出 JSON</button>
</header>
<nav id="scroll-navigation" class="scroll-navigation" aria-label="结果进度与快速定位" hidden>
  <button id="jump-start" aria-label="跳到结果开头" title="跳到结果开头"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 2h8M3 8l4-4 4 4M7 4v8"/></svg></button>
  <div id="scroll-rail" class="scroll-rail" role="scrollbar" tabindex="0" aria-label="按当前筛选结果定位" aria-orientation="vertical" aria-controls="rows" aria-valuemin="1" aria-valuemax="1" aria-valuenow="1" title="拖动或点击定位；方向键微调，Home / End 到首尾">
    <div id="scroll-thumb" class="scroll-thumb"></div>
    <output id="rail-position" class="rail-position" aria-hidden="true"></output>
  </div>
  <button id="jump-end" aria-label="跳到结果末尾" title="跳到结果末尾"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 12h8M3 6l4 4 4-4M7 2v8"/></svg></button>
</nav>
<div id="site-update" hidden role="status">发现新版本。<button type="button" onclick="refreshSite()">刷新到最新版</button></div>
<section id="site-loading" hidden aria-live="polite" aria-labelledby="site-loading-title">
  <h1 id="site-loading-title">正在加载数据库</h1><p id="site-loading-message"></p>
  <div class="loading-actions"><button id="site-retry" type="button" hidden>重试</button><button type="button" onclick="refreshSite()">刷新到最新版</button><a href="#home">返回首页</a></div>
</section>
<!--__ASCENDC_MAP__-->
<!--__INSIGHTS__-->
<div class="workspace">
  <aside id="sidebar" class="sidebar" aria-label="指令分类">
    <nav class="views" aria-label="内容类型">
      <button data-view="interfaces" class="view active">指令接口 <span id="nav-interfaces"></span></button>
      <button data-view="definitions" class="view">配套定义 <span id="nav-definitions"></span></button>
      <button data-view="report" class="view">扫描报告</button>
    </nav>
    <section id="family-section"><h2 title="按接口名称关键词归类，仅用于导航">指令族</h2><div id="families"></div></section>
    <div class="sidebar-note">静态提取<p>编译与运行尚未验证</p></div>
  </aside>
  <div id="resize-sidebar" class="splitter" role="separator" tabindex="0" aria-label="调整左侧栏宽度" aria-orientation="vertical" aria-controls="sidebar" title="拖动或用方向键调整；双击或 Enter 恢复默认宽度"></div>
  <main id="main" tabindex="-1">
    <div class="mobile-nav"><label>浏览<select id="mobile-view"><option value="interfaces">指令接口</option><option value="definitions">配套定义</option><option value="report">扫描报告</option></select></label><label id="mobile-family-label">指令族<select id="mobile-family"></select></label></div>
    <div id="catalog-view">
      <div class="catalog-layout">
        <section class="list-pane" aria-label="阅读与检索"><article id="reader-content" hidden></article><div id="ptx-category-brief" class="category-brief" hidden></div><div class="list-summary"><div class="progress-summary"><span id="viewport-range" class="viewport-range" title="当前视口中的名称组范围">0–0 / 0</span><span id="progress-scope" class="progress-scope"></span><span id="result-count" role="status" aria-live="polite"></span></div><button id="reset" class="text-button">重置筛选</button></div><div id="unknown-hint" class="unknown-hint" hidden><span id="unknown-hint-text" role="status"></span><button id="show-hidden" class="text-button">显示待确认</button></div><div class="table-scroll"><table class="interface-table"><thead><tr><th scope="col">接口 / 名称</th><th scope="col" id="classification-heading" title="按接口名称关键词归类，仅用于导航">指令族</th><th scope="col" title="按来源头文件分组，不代表设备支持范围">域</th><th scope="col" class="number">重载</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden><h2>没有匹配的条目</h2><p>试试更短的名称，或重置筛选。</p><button class="quiet-button" id="empty-unknown" hidden>显示待确认</button><button class="quiet-button" id="empty-layer" hidden>查看同路径 Builtins</button><button class="quiet-button" id="empty-reset">重置筛选</button></div></div><div id="load-status" class="load-status" role="status" aria-live="polite"></div></section>
        <div id="resize-detail" class="splitter" role="separator" tabindex="0" aria-label="调整右侧栏宽度" aria-orientation="vertical" aria-controls="detail" title="拖动或用方向键调整；双击或 Enter 恢复默认宽度"></div>
        <button id="expand-lookup" class="quiet-button" hidden>展开查阅</button><section id="detail" class="detail-pane" aria-label="接口详情" tabindex="-1"></section>
      </div>
    </div>
    <section id="report" hidden aria-label="扫描报告"></section>
    <footer><span id="footer-source"></span><span>来源可追溯 · 离线可阅读</span></footer>
  </main>
</div>
<div id="announcement" class="toast" role="status" aria-live="polite"></div>
<noscript>本手册需要启用 JavaScript 才能搜索和浏览接口。结构化数据可在仓库 data 目录读取。</noscript>
<script id="knowledge-data" type="application/json">/*__KNOWLEDGE__*/</script>
<script id="catalog-data" type="application/json">/*__DATA__*/</script>
<script>/*__SCRIPT__*/</script>
</body>
</html>
