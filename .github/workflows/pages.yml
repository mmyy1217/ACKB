name: Deploy ACKB to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate knowledge and unit tests
        run: |
          python3 -m unittest discover -s tests -q
          python3 scripts/ptx_index.py validate
      - name: Build static site
        run: python3 scripts/build.py --site
      - name: Setup Node for loading regression
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check lazy loading and update behavior
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
